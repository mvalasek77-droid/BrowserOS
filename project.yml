name: BrowserOS
options:
  bundleIdPrefix: com.browseros
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: en
  xcodeVersion: "16.0"

targets:
  # iOS companion app — full WKWebView browser engine
  BrowserOS:
    type: application
    platform: iOS
    sources:
      - path: BrowserOS-iOS
        excludes:
          - "**/.DS_Store"
      - path: BrowserOS/Shared
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.browseros.ios
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: BrowserOS-iOS/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: UDM4W27W9V
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_PREVIEWS: true
        SWIFT_EMIT_LOC_STRINGS: YES

  # watchOS app — native SwiftUI rendering of structured data from iPhone
  BrowserOS Watch App:
    type: application
    platform: watchOS
    sources:
      - path: BrowserOS
        excludes:
          - "**/.DS_Store"
          - "BrowserOSComplication.swift"
          - "Models/BrowserModels.swift.disabled"
      - path: BrowserOS/Shared
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.browseros.watchapp
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "4"
        INFOPLIST_FILE: BrowserOS/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: UDM4W27W9V
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        ENABLE_PREVIEWS: true
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_STRICT_OBJC_MSGSEND: YES
        CLANG_ENABLE_MODULES: YES