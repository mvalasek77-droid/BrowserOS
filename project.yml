name: BrowserOS
options:
  bundleIdPrefix: com.steroidos
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: en
  xcodeVersion: "16.0"

targets:
  # iPhone app: the real browser. Streams a live picture of its web view to the watch.
  BrowserOS:
    type: application
    platform: iOS
    sources:
      - path: iPhone
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steroidos.ios
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: iPhone/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: iPhone/BrowserOS.entitlements
        DEVELOPMENT_TEAM: UDM4W27W9V
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_PREVIEWS: true
    dependencies:
      - target: BrowserOS Watch App
        embed: true

  # Watch app: shows the picture, sends taps / scrolls / URLs back.
  BrowserOS Watch App:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steroidos.ios.watchapp
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "4"
        INFOPLIST_FILE: Watch/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Watch/BrowserOS-Watch.entitlements
        DEVELOPMENT_TEAM: UDM4W27W9V
        ENABLE_PREVIEWS: true
        SDKROOT: watchos
        WATCHOS_DEPLOYMENT_TARGET: "10.0"

schemes:
  BrowserOS:
    build:
      targets:
        BrowserOS: all
    run:
      config: Debug
      executable: BrowserOS
  BrowserOS Watch App:
    build:
      targets:
        "BrowserOS Watch App": all
    run:
      config: Debug
      executable: "BrowserOS Watch App"
