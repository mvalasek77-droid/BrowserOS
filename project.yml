name: SteroidOS
options:
  bundleIdPrefix: com.steroidos
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: en
  xcodeVersion: "16.0"

targets:
  # iOS companion app — full WKWebView browser engine
  SteroidOS:
    type: application
    platform: iOS
    sources:
      - path: SteroidOS-iOS
        excludes:
          - "**/.DS_Store"
      - path: SteroidOS/Shared
        excludes:
          - "**/.DS_Store"
      - path: SteroidOS/Services/ErrorLog.swift
      - path: SteroidOS/Services/PersistenceStore.swift
      - path: SteroidOS/Views/ErrorLogView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steroidos.ios
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: SteroidOS-iOS/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: SteroidOS-iOS/SteroidOS-iOS.entitlements
        DEVELOPMENT_TEAM: UDM4W27W9V
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_PREVIEWS: true
        SWIFT_EMIT_LOC_STRINGS: YES
        # StoreKit configuration file for local testing in the simulator.
        # In production (App Store / TestFlight), the real App Store products
        # are used automatically.
        StoreKitConfigurationFile: SteroidOS.storekit
    dependencies:
      - target: SteroidOS Watch App
        embed: true

  # watchOS app — native SwiftUI rendering of structured data from iPhone
  SteroidOS Watch App:
    type: application
    platform: watchOS
    sources:
      - path: SteroidOS
        excludes:
          - "**/.DS_Store"
          - "Models/BrowserModels.swift.disabled"
      - path: SteroidOS/Shared
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steroidos.ios.watchapp
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "4"
        INFOPLIST_FILE: SteroidOS/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: SteroidOS/SteroidOS-Watch.entitlements
        DEVELOPMENT_TEAM: UDM4W27W9V
        ENABLE_PREVIEWS: true
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_STRICT_OBJC_MSGSEND: YES
        CLANG_ENABLE_MODULES: YES
        SDKROOT: watchos
        WATCHOS_DEPLOYMENT_TARGET: "10.0"

  # Cinema Composer Pro — AI feature-film conductor, producer and cutting room
  CinemaComposerPro:
    type: application
    platform: iOS
    sources:
      - path: CinemaComposerPro
        excludes:
          - "**/.DS_Store"
          - "Info.plist"
          - "CinemaComposerPro.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steroidos.cinemacomposer
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: CinemaComposerPro/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: CinemaComposerPro/CinemaComposerPro.entitlements
        DEVELOPMENT_TEAM: UDM4W27W9V
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_PREVIEWS: true
        SWIFT_EMIT_LOC_STRINGS: YES

  # Engine tests: breakdown, planner, budget, rack, timeline, conductor
  CinemaComposerProTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CinemaComposerProTests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steroidos.cinemacomposer.tests
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: CinemaComposerPro

schemes:
  SteroidOS:
    build:
      targets:
        SteroidOS: all
    run:
      config: Debug
      executable: SteroidOS
  SteroidOS Watch App:
    build:
      targets:
        "SteroidOS Watch App": all
    run:
      config: Debug
      executable: "SteroidOS Watch App"
  CinemaComposerPro:
    build:
      targets:
        CinemaComposerPro: all
        CinemaComposerProTests: [test]
    run:
      config: Debug
      executable: CinemaComposerPro
    test:
      config: Debug
      targets:
        - CinemaComposerProTests
